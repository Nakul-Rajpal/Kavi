# Minimal nginx-rtmp: RTMP ingest + HLS output with no FFmpeg exec.
# Use app "live" and stream key "dji" -> HLS at /live/dji/index.m3u8
daemon off;
error_log /dev/stdout info;
events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      hls on;
      hls_path /opt/data/hls;
      hls_fragment 3;
      hls_playlist_length 60;
      hls_nested on;
    }
  }
}

http {
  access_log /dev/stdout combined;
  server {
    listen 80;
    location /live {
      alias /opt/data/hls;
      types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }
  }
}
